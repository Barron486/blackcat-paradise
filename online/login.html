<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>帳號登入 · 黑貓天堂</title><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/online/admin.css"><link rel="stylesheet" href="/online/admin-mobile.css"></head>
<body class="login-page"><main class="auth-shell"><div class="auth-art"><span class="eyebrow">BLACK CAT PARADISE</span><h1>黑貓天堂</h1><p>經典放置冒險</p><div class="auth-caption">你的冒險，從這裡繼續。</div></div><section class="auth-panel"><span class="eyebrow">WELCOME, ADVENTURER</span><h2 id="auth-title">登入遊戲</h2><p id="auth-description" class="muted">使用帳號載入你的雲端角色與存檔。</p><form id="auth-form"><label>帳號<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="3～24 個英數字或底線" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" placeholder="至少 12 字" required></label><label id="repeat-wrap" hidden>確認密碼<input name="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label><p id="auth-error" class="error" role="alert"></p><button class="primary" id="auth-submit" type="submit">登入遊戲 →</button></form><button id="auth-toggle" class="text-button" type="button">還沒有帳號？建立新帳號</button><button id="setup-link" class="setup-link" type="button" hidden>♛ 首次設定：建立 GM 管理員</button><small class="auth-note">黑貓天堂 · 帳號與雲端存檔<br><a href="/online/credits.html">素材與授權</a></small></section></main><script src="/online/login.js" defer></script></body></html>
